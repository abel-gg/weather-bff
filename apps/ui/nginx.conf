server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Vite fingerprints these filenames, so a given URL's content can never
  # change. Caching them for a year is safe and removes them from every repeat
  # visit entirely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html is the one file that must NOT be cached: it is what points at
  # the new fingerprinted bundles. Cache it and users keep loading the old app
  # long after a deploy, which is the classic "why are they still seeing the
  # bug I fixed" incident.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Same origin as the SPA, so the browser never issues a preflight and CORS
  # stays out of the production path entirely.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Start the trace at the edge. The API honours this header, so one id
    # follows a request from nginx through to the application log.
    proxy_set_header X-Request-Id $request_id;
  }

  # A client-side router owns the URL space: unknown paths are the app's
  # problem, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
